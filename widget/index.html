<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self';" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<title>Starball Lab</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="widget compact">
    <!-- 50px broadcast title bar: logo · context line · search · back · text tabs · pin. The native
         minimize / maximize / close overlay sits at the right edge (Snap Layouts hangs off it). -->
    <header id="titlebar">
      <div class="drag">
        <span class="logo" id="home" title="Matchday">
          <svg class="logo-mark" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="lcp"><circle cx="50" cy="50" r="46"/></clipPath></defs><circle cx="50" cy="50" r="46" fill="#ffffff"/><g clip-path="url(#lcp)" fill="#070b1f"><polygon points="50.00,28.00 57.05,40.29 70.92,43.20 61.41,53.71 62.93,67.80 50.00,62.00 37.07,67.80 38.59,53.71 29.08,43.20 42.95,40.29"/><polygon points="50.00,104.00 45.56,92.12 32.88,91.56 42.81,83.66 39.42,71.44 50.00,78.44 60.58,71.44 57.19,83.66 67.12,91.56 54.44,92.12"/><polygon points="-1.36,66.69 8.57,58.79 5.18,46.56 15.76,53.56 26.34,46.56 22.95,58.79 32.88,66.69 20.21,67.24 15.76,79.12 11.32,67.24"/><polygon points="18.26,6.31 28.84,13.32 39.42,6.31 36.03,18.54 45.96,26.44 33.28,26.99 28.84,38.88 24.40,26.99 11.72,26.44 21.65,18.54"/><polygon points="81.74,6.31 78.35,18.54 88.28,26.44 75.60,26.99 71.16,38.88 66.72,26.99 54.04,26.44 63.97,18.54 60.58,6.31 71.16,13.32"/><polygon points="101.36,66.69 88.68,67.24 84.24,79.12 79.79,67.24 67.12,66.69 77.05,58.79 73.66,46.56 84.24,53.56 94.82,46.56 91.43,58.79"/></g><circle cx="50" cy="50" r="46" fill="none" stroke="#070b1f" stroke-width="4"/></svg><span class="logo-txt">Starball<span class="logo-accent">Lab</span></span>
        </span>
        <span id="subtitle" class="subtitle"></span>
        <span id="round" class="round-pill" hidden></span>
      </div>
      <div class="controls">
        <button id="fresh" class="fresh" title="Click to refresh now" hidden></button>
        <div class="search"><input id="q" type="text" placeholder="Search team   /" autocomplete="off" spellcheck="false" /><div id="q-results" hidden></div></div>
        <button id="back" class="navbtn off" title="Back (Esc)">&#9664;</button>
        <button id="tab-matchday" class="tab" title="Tonight's slate + the card">Matchday</button>
        <button id="tab-match" class="tab" title="The tracked match">Match</button>
        <button id="tab-builder" class="tab" title="Parlay builder">Builder</button>
        <button id="tab-standings" class="tab" title="League table / bracket">Table</button>
        <button id="tab-record" class="tab" title="Bet record">Record</button>
        <span class="vsep"></span>
        <button id="btn-expand" class="iconbtn" title="Expand / compact">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-pin" class="iconbtn on" title="Pin on top">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 4 H15 L14 10 L17 13 V14 H7 V13 L10 10 Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 14 V20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main id="main">
      <!-- lower third + crawl: filled per view (match, builder); hidden elsewhere -->
      <div id="third" class="third" hidden></div>
      <div id="ticker" class="ticker" hidden></div>
      <div id="body" class="body"></div>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
