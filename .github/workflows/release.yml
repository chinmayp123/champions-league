# Build the Starball Lab installers on a version tag and attach them to a GitHub release:
#   git tag v1.1.0 && git push origin v1.1.0
# Windows builds on a Windows runner (NSIS setup .exe), macOS on a Mac runner (.dmg, x64 + Apple
# silicon). Neither is code-signed: Windows shows a SmartScreen "more info → run anyway" the
# first time, macOS needs right-click → Open the first time (no Apple developer account).
name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
