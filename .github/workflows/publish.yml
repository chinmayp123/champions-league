# Starball Lab publisher: runs the data layer every 5 minutes and writes the views to Firestore for
# the GitHub Pages site (see publisher/publish.mjs). Free — Actions minutes are unlimited on a public
# repo. Caveats: GitHub often starts scheduled runs 5–20 minutes late, and it pauses a schedule after
# 60 days with no commits to the repo.
name: publish
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# one run at a time: the publisher is the only writer of the records, so runs must never overlap
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STARBALL_PUBLISHER_EMAIL: ${{ secrets.STARBALL_PUBLISHER_EMAIL }}
      STARBALL_PUBLISHER_PASSWORD: ${{ secrets.STARBALL_PUBLISHER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: publisher/package-lock.json
      - run: npm ci --prefix publisher

      - name: Live (free feeds only, no odds keys)
        run: node publisher/publish.mjs live

      - name: Card, builder, closing prices (odds keys, rationed)
        if: ${{ !cancelled() }}
        run: node publisher/publish.mjs keyed
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
